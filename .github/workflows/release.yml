name: Release

# Tag a release (`git tag v1.0.1 && git push --tags`) or run this workflow
# manually. Store publishing steps are opt-in: each one is skipped unless its
# secrets are configured (see store/publishing.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: Publish to the Chrome Web Store
        type: boolean
        default: false
      publish_firefox:
        description: Publish to Firefox Add-ons (AMO)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$manifest" = "$tag" ] || {
            echo "tag $tag does not match manifest version $manifest" >&2
            exit 1
          }

      - id: meta
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package the extension
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: dist/*.zip

  github-release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true

  chrome-web-store:
    runs-on: ubuntu-latest
    needs: build
    if: inputs.publish_chrome
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: extension-zip
          path: dist

      # The extension must already exist in the dashboard: the API can only
      # update an item, never create the first one.
      - name: Upload and publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          [ -n "$EXTENSION_ID" ] || { echo "CWS secrets missing, skipping"; exit 0; }
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "$(ls dist/*.zip)" --auto-publish

  firefox-addons:
    runs-on: ubuntu-latest
    needs: build
    if: inputs.publish_firefox
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The add-on must already exist on AMO: create the listing once by hand,
      # then every later version is signed and submitted from here.
      - name: Sign and submit the new version
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          [ -n "$AMO_JWT_ISSUER" ] || { echo "AMO secrets missing, skipping"; exit 0; }
          npx web-ext sign \
            --channel listed \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
